<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <title>passat</title>
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body class="todo-page">
    
    <h1 class="todo-main-title">passat</h1>
    
    <div class="todo-app-cointainer">
      <header class="todo-header"> 
       <input class="todo-new-input" type="text" placeholder="coll or not">
      </header>

      <section class="todo-main-section"
      <ul class="todo-items-list">
        <li class="todo-item">
          <input type="radio" name="choose" id="opt1" class="todo-toggle-radio">
          <label for="opt1" class="todo-item-label"> cool </label>
        </li>
        <li>
          <input type="radio" name="choose" id="opt2" class="todo-toggle-radio">
          <label for="opt2" class="todo-item-label"> bad </label>
        </li>      
      </ul>
      </section> 
      
      <footer class="todo-footer-panel">
        <span class="todo-count"> does not have a correct answer</span>
        <div class="todo-filters">
          <button>all</button>
          <button>active</button>
          <button>completed</button>
        </div>
        <button class="clear">Clear completed</button>
      </div>
    </div>
  </body>
</html>
