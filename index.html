<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <title>passat</title>
    <link rel="stylesheet" href="style.css"> 
  </head>
  <body>
    
    <h1>passat</h1>
    
    <div class="todoapp">
      <input class="new-todo" type="text" placeholder="Пассат норм чи стрьом?">
    
      <ul class="todo-list">
        <li>
          <input type="radio" name="choose" id="opt1" class="toggle">
          <label for="opt1"> норм </label>
        </li>
        <li>
          <input type="radio" name="choose" id="opt2" class="toggle">
          <label for="opt2"> стрьом </label>
        </li>      
      </ul>
      <div class="footer">
        <span> не має правильної відповіді</span>
        <div class="filters">
          <button>all</button>
          <button>active</button>
          <button>completed</button>
        </div>
        <button class="clear">Clear completed</button>
      </div>
    </div>
  </body>
</html>
